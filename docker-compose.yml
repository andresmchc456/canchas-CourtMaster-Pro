services:
  postgres:
    image: postgres:16-alpine
    container_name: canchas_postgres
    restart: always
    environment:
      POSTGRES_DB: canchas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

